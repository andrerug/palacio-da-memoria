<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palácio da Memória</title>
    <meta name="description" content="Fotos dos seus lugares + o texto que você precisa decorar = uma cena absurda por item, entregue como PDF de slides." />
    <meta name="theme-color" content="#F2F4F8" />
    <script>
      try { var t = localStorage.getItem('tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <!-- Design system André Viana: tokens, componentes e fonte Archivo -->
    <link rel="stylesheet" href="/av/av.css" />
  </head>
  <body class="av">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
